<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>My Shift Recorder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f8cff">
</head>
<body>
    <div class="container">
        <h1>My Shift Recorder</h1>
        <form id="shiftForm">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="workstation">Workstation:</label>
            <div id="workstationRadios" class="workstation-radios">
                <label><input type="radio" name="workstation" value="1" required> 1</label>
                <label><input type="radio" name="workstation" value="2"> 2</label>
                <label><input type="radio" name="workstation" value="3"> 3</label>
                <label><input type="radio" name="workstation" value="4"> 4</label>
                <label><input type="radio" name="workstation" value="5"> 5</label>
                <label><input type="radio" name="workstation" value="6"> 6</label>
                <label><input type="radio" name="workstation" value="7"> 7</label>
                <label><input type="radio" name="workstation" value="8"> 8</label>
                <label><input type="radio" name="workstation" value="9"> 9</label>
                <label><input type="radio" name="workstation" value="10"> 10</label>
                <label><input type="radio" name="workstation" value="11"> 11</label>
                <label><input type="radio" name="workstation" value="12"> 12</label>
            </div>

            <label for="shift">Shift:</label>
            <div id="shiftRadios" class="shift-radios">
                <label><input type="radio" name="shift" value="Morning" required> <span class="shift-caption" data-shift="Morning">Morning</span></label>
                <label id="shiftEveningLabel"><input type="radio" name="shift" value="Evening"> <span class="shift-caption" data-shift="Evening">Evening</span></label>
                <label id="shiftNightLabel"><input type="radio" name="shift" value="Night"> <span class="shift-caption" data-shift="Night">Night</span></label>
            </div>
            <div id="workstationScheduleHint" class="schedule-hint" aria-live="polite"></div>
            <p class="schedule-hint-pay" hidden aria-hidden="true">First shift per day: Rs 2300. Additional shifts same day: each shift’s scheduled hours × Rs 225 (varies by workstation and shift).</p>

            <label for="extraStartTime">Extra Hours Start Time (optional):</label>
            <input type="time" id="extraStartTime" name="extraStartTime" step="60">

            <label for="extraStopTime">Extra Hours Stop Time (optional):</label>
            <input type="time" id="extraStopTime" name="extraStopTime" step="60">

            <label for="extraHours">Extra Hours Covered (optional):</label>
            <input type="number" id="extraHours" name="extraHours" min="0" step="0.01" placeholder="Enter extra hours">

            <label for="coveredFor">Covered For (Name, optional):</label>
            <input type="text" id="coveredFor" name="coveredFor" placeholder="Enter name if covering for someone">

            <button type="submit">Save Shift</button>
        </form>
        <h2>Future Shifts</h2>
        <ul id="futureShifts"></ul>
        <h2>Shift History</h2>
        <div class="month-year-toolbar">
            <label for="monthSelect">Month:</label>
            <select id="monthSelect" class="month-year-select"></select>
            <label for="yearSelect">Year:</label>
            <select id="yearSelect" class="month-year-select"></select>
        </div>
        <div id="shiftCount" class="stat-line"></div>
        <div id="coveredShiftHours" class="stat-line"></div>
        <button type="button" id="exportXLSX" class="btn-block">Export as Excel (XLSX)</button>
        <button type="button" id="importXLSX" class="btn-block">Import Excel (XLSX)</button>
        <input type="file" id="importFile" accept=".xlsx" style="display:none;" />
        <input type="date" id="moveToFutureDate" style="display:none;" />
        <ul id="shiftHistory"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
